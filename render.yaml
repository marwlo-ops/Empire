services:
  - type: web
    name: game-center-bot
    runtime: node
    rootDir: bot-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://marwlo-ops.github.io
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
